packages:
  - vendor/lyric-kit
  - vendor/lyric-dom
  - vendor/applemusic-like-lyrics/packages/core

# vendor/applemusic-like-lyrics 是 monorepo，其包内用 catalog: 引用依赖，
# 版本与其仓库 pnpm-workspace.yaml 保持一致
catalog:
  "@biomejs/biome": ^2.5.7
  "@tsdown/css": ^0.22.14
  "@ungap/structured-clone": ^1.3.3
  tsdown: ^0.22.14
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.12.0
  vitest: ^4.1.10

minimumReleaseAge: 4320
allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - app-builder-lib@26.15.3
  - builder-util@26.15.3
  - dmg-builder@26.15.3
  - electron-builder-squirrel-windows@26.15.3
  - electron-builder@26.15.3
  - electron-publish@26.15.3
  - esbuild@0.28.2
  - "@esbuild/*"
  - baseline-browser-mapping@2.11.13
  - browserslist@4.28.8
  - electron-to-chromium@1.5.403

overrides:
  node-abi: ^4.33.0
  # vendor 的 AMLL core 把 @pixi/* 声明为 "*" 对等依赖，自动装对等依赖时会挑到 6.x，
  # 与仓库 devDependencies 里的 7.4.3 不同实例，打包时 @pixi/display 会取不到 Rectangle
  "@pixi/core": ^7.4.3
